<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título dinámico -->
    <title>{% block title %}Tienda Libre{% endblock %}</title>
    
    <!-- BOOTSTRAP 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos Globales (Navbar y fondo) -->
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 80px; /* Espacio para que el navbar fijo no tape el contenido */
        }
        
        .bg-gradient-custom {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
        }
        
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Efecto hover para los enlaces del nav */
        .nav-link {
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
    </style>

    <!-- BLOQUE PARA CSS EXTRA: Las páginas hijas inyectarán su propio CSS aquí -->
    {% block extra_css %}{% endblock %}

</head>
<body>

    <!-- BARRA DE NAVEGACIÓN (Usando clases de Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-custom fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalogo' %}">Tienda Libre</a>
            
            <!-- Botón hamburguesa para celulares -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'catalogo' %}">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'acercademi' %}">Acerca de Mí</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL: Las páginas hijas inyectarán su HTML aquí -->
    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- BOOTSTRAP 5 JS (Para que funcione el menú en celulares y otros interactivos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- BLOQUE PARA SCRIPTS EXTRA -->
    {% block extra_js %}{% endblock %}

</body>
</html>
