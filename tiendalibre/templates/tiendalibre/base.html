<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Tienda Libre{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 80px; 
        }
        .bg-gradient-custom {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
        }
        .navbar-brand { font-size: 24px; font-weight: bold; }
        .nav-link { font-weight: 500; transition: 0.3s; }
        .nav-link:hover { background-color: rgba(255, 255, 255, 0.2); border-radius: 8px; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- BLOQUE DE NAVBAR: Por defecto incluye la navbar de la tienda -->
    {% block navbar %}
        {% include 'tiendalibre/navbar.html' %}
    {% endblock %}

    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}{% endblock %}

</body>
</html>
